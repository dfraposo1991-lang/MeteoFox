<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeteoFox · Avisos</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px system-ui;background:#f4f8fb;color:#16466f}header,section{padding:14px}header{background:#16466f;color:white;font-weight:700}header a{color:white}#map{height:60vh;min-height:320px}button,input{font:inherit}button{padding:8px;border:1px solid #b9d2e2;border-radius:8px;background:white;color:#16466f}#units{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}#status{white-space:pre-wrap}small{display:block}</style><header><a href="index.html">MeteoFox</a> · Avisos meteorológicos</header><section><strong>Pré-visualização local — não oficial</strong><p>Importar Excel (.xlsm ou .xlsx). Os dados ficam nesta sessão do navegador; não são publicados. Marcadores em localidades aproximadas.</p><input id="file" type="file" accept=".xlsm,.xlsx"><p id="status" role="status">Nenhum ficheiro importado.</p><span style="color:#89939e">● Sem aviso</span> · <span style="color:#a47700">● Bandeira</span> · <span style="color:#dc2626">● Gravoso</span> · ● Estado desconhecido</section><div id="map"></div><section id="units"></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const ids='ER1 ER2 ER3 ER4 BA8 BA5 CFMTFA UAL CA DGMFA CT BA1 BA6 BA11 BA4 PS'.split(' ');
const map=L.map('map').setView([37,-16],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
// Approximate locality positions, not installation coordinates.
const locations={ER1:[37.32,-8.56],ER2:[41.28,-8.38],ER3:[39.18,-9.04],ER4:[32.73,-16.93],BA8:[40.86,-8.63],BA5:[39.85,-8.86],CFMTFA:[39.12,-8.99],UAL:[38.73,-9.22],CA:[38.72,-9.19],DGMFA:[38.90,-9.04],CT:[38.76,-8.96],BA1:[38.80,-9.38],BA6:[38.71,-8.97],BA11:[38.02,-7.86],BA4:[38.76,-27.10],PS:[33.06,-16.34]};
const markers={};
for(const id of ids)markers[id]=L.marker(locations[id]).addTo(map);
map.fitBounds(Object.values(locations),{padding:[30,30]});
function markerContent(id,color,symbols){const el=document.createElement('div');el.style.cssText='display:flex;align-items:center;gap:4px;white-space:nowrap;background:white;border:1px solid #b9d2e2;border-radius:12px;padding:3px 6px;width:max-content;box-shadow:0 1px 4px #0003';const dot=document.createElement('span');dot.className='dot';dot.style.background=color;el.append(dot,document.createTextNode(id+' '+symbols));return el;}
let records=null;
function dateUTC(v,date1904=false){if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v,{date1904});return d?Date.UTC(d.y,d.m-1,d.d,d.H,d.M,Math.round(d.S)):NaN;}const m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/);if(!m)return NaN;const t=Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);const d=new Date(t);return d.getUTCFullYear()===+m[3]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[1]&&d.getUTCHours()===+m[4]&&d.getUTCMinutes()===+m[5]?t:NaN;}
function render(){const now=Date.now();const host=document.getElementById('units');host.replaceChildren();for(const id of ids){const active=(records||[]).filter(r=>r.id===id&&r.start<=now&&now<r.end);const type=active.some(r=>r.type==='Gravoso')?'Gravoso':active.length?'Bandeira':records?'Sem aviso':'Desconhecido';const color=({Gravoso:'#dc2626',Bandeira:'#eab308','Sem aviso':'#89939e',Desconhecido:'#89939e'})[type];const b=document.createElement('button');const dot=document.createElement('span');dot.className='dot';dot.style.background=color;b.append(dot,document.createTextNode(id+' · '+type+' '+[...new Set(active.flatMap(r=>r.symbols))].join(' ')));b.onclick=()=>{const details=active.map(r=>r.type+' · '+r.phen+' · '+new Date(r.start).toISOString()+' — '+new Date(r.end).toISOString()+' '+r.note).join('\n');document.getElementById('status').textContent=id+' · '+type+(details?'\n'+details:'');};host.append(b);const symbols=[...new Set(active.flatMap(r=>r.symbols))].join(' ');markers[id].setIcon(L.divIcon({className:'warning-marker',html:markerContent(id,color,symbols),iconSize:[1,1],iconAnchor:[0,0]}));const detail=document.createElement('div');detail.style.whiteSpace='pre-wrap';detail.textContent=id+' · '+type+'\n'+active.map(r=>r.type+' · '+r.phen+'\n'+new Date(r.start).toISOString()+' — '+new Date(r.end).toISOString()+'\n'+r.note).join('\n\n');if(markers[id].getPopup())markers[id].setPopupContent(detail);else markers[id].bindPopup(detail);const previous=b.onclick;b.onclick=()=>{previous();map.setView(locations[id],Math.max(map.getZoom(),10));markers[id].openPopup();};}}
const phenomena=['💧 Chuva','⚡ Trovoada','💨 Vento','🌨️ Granizo','❄️ Neve','🌡️ Tempo quente','🥶 Tempo frio','🧊 Saraiva'];
function parsePhen(v){const parts=String(v).split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean);return parts.map(p=>{const match=phenomena.find(x=>x===p||x.slice(x.indexOf(' ')+1).toLowerCase()===p.toLowerCase());if(!match)throw Error('Fenómeno desconhecido: '+p);return match.split(' ')[0];});}
document.getElementById('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const w=XLSX.read(await f.arrayBuffer());const sheet=w.Sheets['Avisos meteorológicos'];if(!sheet)throw Error('Folha Avisos meteorológicos em falta');const headers=XLSX.utils.sheet_to_json(sheet,{header:1})[0]||[];for(const h of ['Local','Tipo de aviso','Nível','Início do aviso','Fim do aviso'])if(!headers.includes(h))throw Error('Coluna em falta: '+h);const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});const next=[];for(const r of rows){if(!['Local','Tipo de aviso','Nível','Início do aviso','Fim do aviso','Aviso'].some(k=>r[k]!==''))continue;const id=String(r.Local).trim(),type=String(r['Nível']).trim(),start=dateUTC(r['Início do aviso'],!!w.Workbook?.WBProps?.date1904),end=dateUTC(r['Fim do aviso'],!!w.Workbook?.WBProps?.date1904);if(!ids.includes(id)||!['Bandeira','Gravoso'].includes(type)||!Number.isFinite(start)||!Number.isFinite(end)||end<=start)throw Error('Linha inválida: '+(r.__rowNum__+1));const symbols=parsePhen(r['Tipo de aviso']);if(!symbols.length)throw Error('Fenómenos em falta');next.push({id,type,start,end,symbols,phen:String(r['Tipo de aviso']),note:String(r.Aviso||'')});}records=next;render();document.getElementById('status').textContent='Importação local: '+next.length+' avisos.';}catch(err){document.getElementById('status').textContent='Importação rejeitada; estado anterior conservado. '+err.message;}};
render();setInterval(render,30000);
</script></html>
