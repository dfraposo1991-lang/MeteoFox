<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeteoFox · Avisos</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:15px system-ui;background:#f4f8fb;color:#16466f}header,section{padding:14px}header{background:#16466f;color:white;font-weight:700}header a{color:white}#map{height:60vh;min-height:320px}button,input{font:inherit}button{padding:8px;border:1px solid #b9d2e2;border-radius:8px;background:white;color:#16466f}#units{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}#status{white-space:pre-wrap}small{display:block}</style><header><a href="index.html">MeteoFox</a> · Avisos meteorológicos</header><section><strong>Pré-visualização local — não oficial</strong><p>Importar Excel (.xlsx). Os dados ficam nesta sessão do navegador; não são publicados.</p><input id="file" type="file" accept=".xlsx"><p id="status" role="status">Nenhum ficheiro importado.</p><span style="color:#16803b">● Sem aviso</span> · <span style="color:#a47700">● Bandeira</span> · <span style="color:#dc2626">● Gravoso</span> · ● Estado desconhecido</section><div id="map"></div><section id="units"></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const ids='ER1 ER2 ER3 ER4 BA8 BA5 CFMTFA UAL CA DGMFA CT BA1 BA6 BA11 BA4 PS'.split(' ');
const map=L.map('map').setView([37,-16],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
let records=null;
function dateUTC(v){if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?Date.UTC(d.y,d.m-1,d.d,d.H,d.M,Math.round(d.S)):NaN;}const m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/);if(!m)return NaN;const t=Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5]);const d=new Date(t);return d.getUTCFullYear()===+m[3]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[1]&&d.getUTCHours()===+m[4]&&d.getUTCMinutes()===+m[5]?t:NaN;}
function render(){const now=Date.now();const host=document.getElementById('units');host.replaceChildren();for(const id of ids){const active=(records||[]).filter(r=>r.id===id&&r.start<=now&&now<r.end);const type=active.some(r=>r.type==='Gravoso')?'Gravoso':active.length?'Bandeira':records?'Sem aviso':'Desconhecido';const color=({Gravoso:'#dc2626',Bandeira:'#eab308','Sem aviso':'#22a447',Desconhecido:'#89939e'})[type];const b=document.createElement('button');const dot=document.createElement('span');dot.className='dot';dot.style.background=color;b.append(dot,document.createTextNode(id+' · '+type));b.onclick=()=>{const details=active.map(r=>r.type+' · '+r.phen+' · '+new Date(r.start).toISOString()+' — '+new Date(r.end).toISOString()+' '+r.note).join('\n');document.getElementById('status').textContent=id+' · '+type+(details?'\n'+details:'');};host.append(b);}}
document.getElementById('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const w=XLSX.read(await f.arrayBuffer());if(!w.Sheets.Avisos)throw Error('Folha Avisos em falta');const rows=XLSX.utils.sheet_to_json(w.Sheets.Avisos,{defval:''});const next=[];for(const [i,r] of rows.entries()){if(!r['Tipo de aviso']&&!r['Fenómeno']&&!r['Início UTC']&&!r['Fim UTC']&&!r.Observações)continue;const id=r.Unidade,type=r['Tipo de aviso'],start=dateUTC(r['Início UTC']),end=dateUTC(r['Fim UTC']);if(!ids.includes(id)||!['Bandeira','Gravoso'].includes(type)||!String(r['Fenómeno']).trim()||!Number.isFinite(start)||!Number.isFinite(end)||end<=start)throw Error('Linha de aviso inválida: '+(i+2));next.push({id,type,start,end,phen:String(r['Fenómeno']),note:String(r.Observações)});}records=next;render();document.getElementById('status').textContent='Importação local: '+next.length+' avisos.';}catch(err){document.getElementById('status').textContent='Importação rejeitada; estado anterior conservado. '+err.message;}};
render();setInterval(render,30000);
</script></html>
