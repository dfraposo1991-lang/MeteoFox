name: MeteoFox | Diagnostico VIS SW Europe 48h v3

on:
  workflow_dispatch:
    inputs:
      base_time:
        description: 'Run UTC YYYYMMDDHHMM (opcional: deixar vazio para automático)'
        required: false
        type: string
      max_frames:
        description: 'Número de imagens a testar (1 primeiro; até 16)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '3'
          - '16'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Testar OpenCharts sem publicar no MeteoFox
        shell: bash
        env:
          BASE_TIME: ${{ inputs.base_time }}
          MAX_FRAMES: ${{ inputs.max_frames }}
        run: |
          set +e
          if [ -n "$BASE_TIME" ]; then
            python testar_visivel_swe_48h_v3.py --base-time "$BASE_TIME" --max-frames "${MAX_FRAMES:-1}"
          else
            python testar_visivel_swe_48h_v3.py --max-frames "${MAX_FRAMES:-1}"
          fi
          result=$?
          echo "Diagnóstico terminou (código $result). Consultar o artifact para detalhe."
          exit 0
      - name: Guardar relatório e eventuais imagens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-diagnostico-visivel-v3
          path: diagnostico_visivel_48h_v3/
          if-no-files-found: warn
          retention-days: 7
