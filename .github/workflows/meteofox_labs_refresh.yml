name: MeteoFox Labs | Atualizar meteograma e sondagens

on:
  workflow_dispatch:
  schedule:
    # IFS Open Data 0p25. Começar a verificar depois do início da disseminação.
    # Novo ciclo pretendido 18/00/06/12 UTC, respetivamente.
    - cron: '25 2,8,14,20 * * *'

permissions:
  contents: write

# Não interferir com a publicação das 32 cartas ECMWF ou com o radar.
concurrency:
  group: meteofox-labs-data
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Obter código do MeteoFox
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor meteorológico
        run: python -m pip install 'ecmwf-opendata>=0.3,<1' 'eccodes>=2.38,<3'
      - name: Verificar se o ciclo 0p25 está completo e é novo
        id: verificar
        run: |
          python - <<'PY'
          from ecmwf.opendata import Client
          from datetime import timezone
          from pathlib import Path
          import json,os
          from gerar_produtos_experimentais import SURFACE_PARAMS,PRESSURE_PARAMS
          client=Client(source="ecmwf",model="ifs",resol="0p25")
          # A verificação não descarrega GRIB; os 30 ficheiros são validados no gerador.
          surface=client.latest(stream="oper",type="fc",levtype="sfc",step=90,param=list(SURFACE_PARAMS))
          pressure=client.latest(stream="oper",type="fc",levtype="pl",step=48,param=list(PRESSURE_PARAMS))
          if surface!=pressure:
              raise RuntimeError(f"Ciclo 0p25 ainda incompleto: superfície={surface}, pressão={pressure}")
          selected=surface.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          existing=Path("produtos_experimentais/previsao_ecmwf.json")
          previous=json.loads(existing.read_text())["run_utc"] if existing.exists() else None
          print(f"Ciclo confirmado: {selected}; último ciclo guardado: {previous}")
          Path("selected_cycle.txt").write_text(selected)
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("changed="+("false" if selected==previous else "true")+"\n")
          PY
      - name: Gerar 30 períodos de Lisboa e nove sondagens previstas
        if: steps.verificar.outputs.changed == 'true'
        run: python gerar_produtos_experimentais.py --cycle "$(cat selected_cycle.txt)"
      - name: Verificar conjunto completo antes de atualizar
        if: steps.verificar.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("produtos_experimentais/previsao_ecmwf.json").read_text())
          assert len(data["meteogram_lisboa"])==30
          assert [x["step_h"] for x in data["meteogram_lisboa"]]==list(range(3,91,3))
          assert len(data["soundings"])==9
          assert [x["step_h"] for x in data["soundings"]]==list(range(0,49,6))
          assert all(set(x["cities"])=={"Porto","Lisboa","Beja"} for x in data["soundings"])
          print("Validado:",data["run_utc"],"30 períodos; 9 sondagens por cidade")
          PY
      - name: Guardar apenas os dados validados no repositório
        if: steps.verificar.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos_experimentais/previsao_ecmwf.json
          if git diff --cached --quiet; then
            echo "Sem novos dados. Versão existente mantida."
            exit 0
          fi
          git commit -m "Atualizar meteograma Lisboa e sondagens ECMWF 0p25"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
