name: MeteoFox | ECMWF 48h

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Ciclo ECMWF UTC fixado pela recuperação automática (YYYY-MM-DDTHH:MM:SSZ)'
        required: false
        type: string
  schedule:
    # IFS Open Data 0p1: a resolução 0,1° chega ~2 h após a de 0,25°.
    # Correspondência: 02:40 -> run 18 UTC anterior; 09:45 -> 00 UTC;
    # 14:40 -> 06 UTC; 21:45 -> 12 UTC.
    - cron: '40 2 * * *'
    - cron: '45 9 * * *'
    - cron: '40 14 * * *'
    - cron: '45 21 * * *'

permissions:
  contents: read

concurrency:
  group: meteofox-pages
  cancel-in-progress: false

jobs:
  gerar:
    name: Descarregar e gerar os mapas
    runs-on: ubuntu-24.04
    timeout-minutes: 220

    steps:
      - name: Obter os programas MeteoFox
        uses: actions/checkout@v4

      # A verificação é leve: não instala Cartopy, ecCodes nem cria mapas.
      - name: Preparar Python para verificar os dados
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar cliente de verificação ECMWF
        run: python -m pip install 'ecmwf-opendata>=0.3,<1'

      - name: Aguardar novo ciclo completo (verificar cada 10 minutos)
        env:
          ECMWF_REQUESTED_CYCLE: ${{ inputs.cycle || '' }}
        shell: bash
        run: |
          if [[ -n "$ECMWF_REQUESTED_CYCLE" ]]; then
            python verificar_ecmwf_48h.py --tries 10 --interval 600 --cycle "$ECMWF_REQUESTED_CYCLE"
          else
            python verificar_ecmwf_48h.py --tries 10 --interval 600
          fi

      - name: Instalar dependências meteorológicas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv python3-eccodes python3-numpy \
            python3-matplotlib python3-cartopy libeccodes-tools

      - name: Preparar Python
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'ecmwf-opendata>=0.3,<1'

      - name: Descarregar 16 passos do mesmo Run
        run: .venv/bin/python descarregar_meteofox_48h.py

      - name: Verificar todos os GRIB2
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          base = Path("dados_meteofox_48h")
          manifest = json.loads((base / "ultimo_run.json").read_text())
          run_folder = base / manifest["pasta"]
          for step in range(3,49,3):
              p = run_folder / f"step_{step:03d}.grib2"
              assert p.exists() and p.stat().st_size > 100_000, f"Incompleto: {p}"
          print("16 GRIB2 completos:", manifest["run"])
          PY

      - name: Gerar os 32 mapas e o HTML
        run: .venv/bin/python gerar_meteofox_48h.py

      - name: Preparar publicação do site completo com o Run mais recente
        run: |
          .venv/bin/python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          manifest = json.loads(Path("dados_meteofox_48h/ultimo_run.json").read_text())
          run = manifest["run"]
          name = "MeteoFox_48h_" + run[:10].replace("-", "") + "_" + run[11:13] + "UTC"
          source = Path(name)
          out = Path("public")
          out.mkdir(exist_ok=True)
          for step in range(3, 49, 3):
              for kind in ("chuva", "rajadas"):
                  f = source / f"{kind}_{step:03d}.png"
                  assert f.exists() and f.stat().st_size > 1000, f"Falta {f}"
                  shutil.copy2(f, out / f.name)
          animation = source / "MeteoFox_animacao_48h.html"
          assert animation.exists() and animation.stat().st_size > 1000
          # Guardar a animação separadamente, para nunca substituir o site principal.
          shutil.copy2(animation, out / "MeteoFox_animacao_48h.html")
          main_site = Path("index.html")
          assert main_site.exists() and main_site.stat().st_size > 1000, "Falta index.html na raiz do repositorio"
          shutil.copy2(main_site, out / "index.html")
          # O mapa interativo e a sincronização radar/Meteosat fazem parte
          # obrigatória do pacote, também nas publicações automáticas ECMWF.
          for name in ("mapa.html", "meteofox_satelite.js", "meteofox_meteograma.js", "meteofox_meteograma.css", "meteofox_keyboard.js"):
              source_file = Path(name)
              assert source_file.is_file() and source_file.stat().st_size > 1000, f"Falta {name}"
              shutil.copy2(source_file, out / name)
          # Manter igualmente o laboratório e o respetivo ciclo ECMWF 0p25
          # em cada publicação automática dos 32 mapas 0p1.
          import json
          lab_page = Path("laboratorio.html")
          lab_data = Path("produtos_experimentais/previsao_ecmwf.json")
          assert lab_page.is_file() and lab_page.stat().st_size > 1000, "Falta laboratório"
          assert lab_data.is_file() and lab_data.stat().st_size > 1000, "Faltam dados laboratório"
          payload = json.loads(lab_data.read_text(encoding="utf-8"))
          assert len(payload["meteogram_lisboa"]) == 30, "Meteograma incompleto"
          assert [r["step_h"] for r in payload["meteogram_lisboa"]] == list(range(3, 91, 3)), "Prazos incorretos"
          assert len(payload["soundings"]) == 9, "Sondagens incompletas"
          assert all(set(r["cities"]) == {"Lisboa", "Porto", "Beja"} for r in payload["soundings"])
          shutil.copy2(lab_page, out / "laboratorio.html")
          (out / "produtos_experimentais").mkdir(exist_ok=True)
          shutil.copy2(lab_data, out / "produtos_experimentais/previsao_ecmwf.json")
          assert all((out / name).is_file() for name in
                     ("index.html", "mapa.html", "meteofox_satelite.js", "meteofox_meteograma.js", "meteofox_meteograma.css", "laboratorio.html",
                      "produtos_experimentais/previsao_ecmwf.json")), "Site incompleto"
          (out / ".nojekyll").write_text("")
          print("Site e animação prontos:", len(list(out.glob("*.png"))), "mapas; Run", run)
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar pacote para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1

  publicar:
    name: Atualizar site MeteoFox
    needs: gerar
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar site completo com novos mapas
        id: deploy
        uses: actions/deploy-pages@v4
