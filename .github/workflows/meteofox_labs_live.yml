name: MeteoFox Labs | Verificar site publicado

on:
  push:
    branches: [main]
    paths: ['.github/workflows/meteofox_labs_live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verificar páginas, dados, mapas e JavaScript no GitHub Pages
        run: |
          python3 - <<'PY'
          import json,time
          from urllib.request import Request,urlopen
          from urllib.error import URLError
          base = 'https://dfraposo1991-lang.github.io/MeteoFox/'
          files = [
              'index.html', 'laboratorio.html',
              'produtos_experimentais/previsao_ecmwf.json',
              'mapa.html', 'meteofox_satelite.js',
              'chuva_003.png', 'rajadas_048.png',
          ]
          result={}
          for name in files:
              for attempt in range(12):
                  try:
                      req=Request(base+name,headers={'User-Agent':'MeteoFox-Labs-QA/1.0',
                                                   'Cache-Control':'no-cache'})
                      with urlopen(req,timeout=25) as response:
                          data=response.read()
                          if response.status!=200 or len(data)<1000:
                              raise RuntimeError(f'{name}: HTTP {response.status}, bytes={len(data)}')
                      result[name]=data
                      print('DISPONÍVEL:',name,len(data),'bytes',flush=True)
                      break
                  except (RuntimeError,URLError) as exc:
                      if attempt==11: raise
                      print('Repetir:',name,exc,flush=True)
                      time.sleep(10)
          home=result['index.html'].decode('utf-8')
          labs=result['laboratorio.html'].decode('utf-8')
          map_page=result['mapa.html'].decode('utf-8')
          assert './laboratorio.html' in home, 'Portal sem link para laboratório'
          assert 'Meteograma' in labs and 'Skew-T' in labs
          assert 'meteofox_satelite.js' in map_page, 'Falta integração de radar/Meteosat'
          data=json.loads(result['produtos_experimentais/previsao_ecmwf.json'])
          assert len(data['meteogram_lisboa'])==30
          assert [v['step_h'] for v in data['meteogram_lisboa']]==list(range(3,91,3))
          assert len(data['soundings'])==9
          assert all(set(v['cities'])=={'Porto','Lisboa','Beja'} for v in data['soundings'])
          print('SITE PUBLICADO OK | Dados ECMWF:',data['run_utc'],flush=True)
          PY
