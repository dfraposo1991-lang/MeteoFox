name: MeteoFox | Atualizar horários reais do Meteosat

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: write

concurrency:
  group: meteofox-satellite-times
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Consultar a dimensão TIME do Meteosat
        run: python3 recolher_horarios_satelite.py
      - name: Publicar apenas os horários confirmados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite_times.json
          if git diff --cached --quiet; then
            echo 'Horários sem alterações.'
          else
            git commit -m "Atualizar horários reais Meteosat"
            # Integra commits entretanto publicados por outros workflows.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep "$((attempt * 2))"
            done
            echo 'Não foi possível publicar horários Meteosat após 5 tentativas.' >&2
            exit 1
          fi
