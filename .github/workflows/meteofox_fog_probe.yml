name: MeteoFox | Validar RGB Fog (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/meteofox_fog_probe.py'
      - '.github/workflows/meteofox_fog_probe.yml'
  schedule:
    - cron: '2,22,42 * * * *'

permissions:
  contents: write

concurrency:
  group: meteofox-fog-probe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar uma vez as capacidades WMS e no máximo um mosaico
        run: python scripts/meteofox_fog_probe.py
      - name: Validar JSON gerado
        run: python -m json.tool data/satellite_fog_status.json > /dev/null
      - name: Guardar diagnóstico (sem modificar camadas do mapa)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite_fog_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar diagnóstico RGB Fog [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
