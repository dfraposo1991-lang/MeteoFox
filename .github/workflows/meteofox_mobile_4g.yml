name: MeteoFox | Testar desempenho em 4G lento
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/meteofox_mobile_4g.mjs'
      - '.github/workflows/meteofox_mobile_4g.yml'
permissions:
  contents: read
jobs:
  medir:
    name: Avaliar imagens em desktop e telemóvel
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Medir carregamento real de chuva, rajadas e VIS
        run: node tests/meteofox_mobile_4g.mjs
      - name: Guardar medições
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-mobile-4g
          path: relatorios/meteofox_mobile_4g.json
          retention-days: 21
          if-no-files-found: warn
