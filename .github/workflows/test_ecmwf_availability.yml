name: MeteoFox | Validar disponibilidade ECMWF 0p1

on:
  push:
    branches: [meteofox-ecmwf-availability-gate]
    paths:
      - 'verificar_ecmwf_48h.py'
      - 'descarregar_meteofox_48h.py'
      - 'tests/test_ecmwf_availability.py'
      - '.github/workflows/meteofox_ecmwf.yml'
      - '.github/workflows/test_ecmwf_availability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe e lógica dos ciclos sem internet ECMWF
        run: |
          python -m py_compile verificar_ecmwf_48h.py descarregar_meteofox_48h.py
          python -m unittest discover -s tests -p 'test_ecmwf_availability.py' -v
