name: MeteoFox | Medir mapa radar e Meteosat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/meteofox_map_performance.mjs'
      - '.github/workflows/meteofox_map_performance.yml'
permissions:
  contents: read
jobs:
  medir:
    name: Avaliar mapa e camadas em desktop, mobile e 4G lento
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium e Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Medir mapa grande com fornecedores reais
        run: node tests/meteofox_map_performance.mjs
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-map-performance
          path: relatorios/mapa_radar_meteosat_performance.json
          retention-days: 21
          if-no-files-found: warn
