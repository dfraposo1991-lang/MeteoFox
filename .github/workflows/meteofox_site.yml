name: MeteoFox | Publicar site sem gerar mapas

on:
  workflow_dispatch:
  # O GITHUB_TOKEN usado no refresh das sondagens não desencadeia um novo push workflow.
  # workflow_run publica o JSON atualizado assim que a geração termina com sucesso.
  workflow_run:
    workflows: ["MeteoFox Labs | Atualizar meteograma e sondagens"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'space-weather.html'
      - 'fox_verified.js'
      - 'fox_verified.css'
      - 'data/aviation.json'
      - 'data/synop.json'
      - 'meteofox_keyboard.js'
      - 'meteofox_meteograma.js'
      - 'meteofox_meteograma.css'
      - 'mapa.html'
      - 'meteofox-logo.png'
      - 'MeteoFox_logo_v1.svg'
      - 'favicon.ico'
      - 'meteofox_satelite.js'
      - 'meteofox_fog_mask.js'
      - 'meteofox_ru_aviation.js'
      - 'data/aviation_valencia.json'
      - 'laboratorio.html'
      - 'produtos_experimentais/previsao_ecmwf.json'
      - '.github/workflows/meteofox_site.yml'
      - '.github/workflows/meteofox_ecmwf.yml'

permissions:
  contents: read

# Usa o mesmo grupo do processo ECMWF, evitando duas publicacoes simultaneas.
concurrency:
  group: meteofox-pages
  cancel-in-progress: false

jobs:
  preparar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Preparar site e conservar mapas existentes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter os ficheiros do MeteoFox
        uses: actions/checkout@v4

      - name: Reutilizar os mapas ja publicados
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.request import Request, urlopen
          import shutil

          public = Path('public')
          public.mkdir(exist_ok=True)

          # Publicar todas as paginas e o JavaScript do mapa grande.
          for name in ('index.html', 'mapa.html', 'space-weather.html', 'meteofox_satelite.js', 'meteofox_fog_mask.js', 'meteofox_ru_aviation.js', 'laboratorio.html', 'meteofox_meteograma.js', 'meteofox_meteograma.css', 'meteofox_keyboard.js', 'fox_verified.js', 'fox_verified.css'):
              source = Path(name)
              assert source.is_file() and source.stat().st_size > 0, f'{name} nao encontrado ou vazio'
              if name.endswith('.html'):
                  assert source.stat().st_size > 1000, f'{name} demasiado pequeno'
              shutil.copy2(source, public / name)
              print('Incluido no site:', name)

          # Ícone oficial MeteoFox: raposa e nuvem no fundo azul do site.
          logo = Path('meteofox-logo.png')
          assert logo.is_file() and logo.stat().st_size > 1000, 'Logótipo MeteoFox em falta'
          shutil.copy2(logo, public / logo.name)
          print('Incluído: meteofox-logo.png')
          for asset_name in ('MeteoFox_logo_v1.svg', 'favicon.ico'):
              asset = Path(asset_name)
              if asset.is_file():
                  shutil.copy2(asset, public / asset.name)
                  print('Incluído:', asset.name)

          # Observações necessárias ao Fox Verified.
          observations = public / 'data'
          observations.mkdir(exist_ok=True)
          for name in ('aviation.json', 'aviation_valencia.json', 'synop.json'):
              source = Path('data') / name
              assert source.is_file(), f'Dados observacionais em falta: {name}'
              json_text = source.read_text(encoding='utf-8')
              import json
              json.loads(json_text)
              shutil.copy2(source, observations / name)
              print('Incluido no site: data/' + name)

          # Produtos ECMWF experimentais são ficheiros validados e versionados
          # no GitHub. Não dependem de serviços externos durante a publicação.
          import json
          source_data = Path('produtos_experimentais/previsao_ecmwf.json')
          assert source_data.is_file(), 'Faltam dados ECMWF de Lisboa e sondagens'
          raw = json.loads(source_data.read_text(encoding='utf-8'))
          assert len(raw['meteogram_lisboa']) == 30
          assert [x['step_h'] for x in raw['meteogram_lisboa']] == list(range(3, 91, 3))
          assert len(raw['soundings']) in (9, 16)
          assert all(set(x['cities']) == {'Porto', 'Lisboa', 'Beja'} for x in raw['soundings'])
          target = public / 'produtos_experimentais'
          target.mkdir(exist_ok=True)
          shutil.copy2(source_data, target / 'previsao_ecmwf.json')
          print('Incluído: laboratório e dados ECMWF reais validados')

          base = 'https://dfraposo1991-lang.github.io/MeteoFox/'
          # Aceitar o conjunto previamente publicado enquanto o primeiro novo run
          # (+9 a +54 h) ainda não tiver sido gerado.
          import json
          from urllib.error import HTTPError
          old_steps = list(range(3, 49, 3))
          new_steps = list(range(9, 55, 3))
          existing_metadata = None
          try:
              manifest_req = Request('https://dfraposo1991-lang.github.io/MeteoFox/meteofox_ecmwf_manifest.json',
                  headers={'Cache-Control': 'no-cache'})
              with urlopen(manifest_req, timeout=20) as response:
                  existing_metadata = json.load(response)
          except (HTTPError, OSError, ValueError) as exc:
              print('Manifesto ainda não disponível:', exc)
          published_images = set((existing_metadata or {}).get('images', {}))
          expected_new = {f'{kind}_{step:03d}.png' for step in new_steps for kind in ('chuva','rajadas')}
          selected_steps = new_steps if published_images == expected_new else old_steps
          files = ['MeteoFox_animacao_48h.html']
          files += [f'{kind}_{step:03d}.png'
                    for step in selected_steps
                    for kind in ('chuva', 'rajadas')]

          def download(name):
              req = Request(base + name, headers={
                  'User-Agent': 'MeteoFox-GitHub-Actions/1.0',
                  'Cache-Control': 'no-cache',
              })
              with urlopen(req, timeout=30) as reply:
                  assert reply.status == 200, f'Erro HTTP no ficheiro {name}'
                  contents = reply.read()
              minimum = 1000 if name.endswith('.html') else 10000
              if len(contents) < minimum:
                  raise RuntimeError(f'Ficheiro ausente ou incompleto: {name}')
              (public / name).write_bytes(contents)
              return name

          # Se algum mapa nao estiver acessivel, a publicacao falha.
          # A versao antiga permanece no GitHub Pages.
          with ThreadPoolExecutor(max_workers=6) as pool:
              for name in pool.map(download, files):
                  print('Conservado:', name)

          # Preservar a identificação do ciclo ECMWF ao republicar a interface.
          # Sites antigos sem manifesto continuam a funcionar normalmente.
          from urllib.error import HTTPError
          import hashlib
          metadata_url = base + 'meteofox_ecmwf_manifest.json'
          try:
              req = Request(metadata_url, headers={'Cache-Control': 'no-cache',
                                                   'User-Agent': 'MeteoFox-GitHub-Actions/1.0'})
              with urlopen(req, timeout=20) as reply:
                  metadata = json.loads(reply.read(500000))
              assert metadata.get('schema') == 1, 'Manifesto ECMWF com versão desconhecida'
              images = metadata.get('images', {})
              assert set(images) == set(files[1:]), 'Lista de cartas incompleta no manifesto'
              for name, checksum in images.items():
                  actual = hashlib.sha256((public / name).read_bytes()).hexdigest()
                  assert actual == checksum, f'Manifesto ECMWF incompatível: {name}'
              (public / 'meteofox_ecmwf_manifest.json').write_text(
                  json.dumps(metadata, indent=2, ensure_ascii=False), encoding='utf-8'
              )
              print('Conservado manifesto do ciclo ECMWF:', metadata['cycle_utc'])
          except HTTPError as exc:
              if exc.code == 404:
                  print('Manifesto ainda não disponível: aguardamos nova produção ECMWF')
              else:
                  raise

          (public / '.nojekyll').write_text('', encoding='utf-8')
          assert len([p for p in public.glob('*.png') if p.name.startswith(('chuva_', 'rajadas_'))]) == 32, 'Faltam mapas ECMWF'
          print('Site pronto: index.html, mapa.html, meteofox_satelite.js, animacao e 32 mapas ECMWF')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1

  publicar:
    name: Publicar alteracoes ao MeteoFox
    needs: preparar
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Atualizar o site
        id: deploy
        uses: actions/deploy-pages@v4
