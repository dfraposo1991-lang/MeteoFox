name: MeteoFox | Teste Satelite VIS SW Europe 48h
on:
  workflow_dispatch:
    inputs:
      base_time:
        description: 'Opcional: Run ECMWF em UTC (YYYYMMDDHHMM); deixar vazio para procurar automaticamente'
        required: false
        type: string
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Testar 16 imagens ECMWF (+3h a +48h)
        shell: bash
        env:
          BASE_TIME: ${{ inputs.base_time }}
        run: |
          set +e
          if [ -n "$BASE_TIME" ]; then
            python testar_visivel_swe_48h.py --base-time "$BASE_TIME"
          else
            python testar_visivel_swe_48h.py
          fi
          rc=$?
          echo "Resultado do diagnóstico: código $rc"
          exit 0
      - name: Disponibilizar relatório e imagens como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-visivel-swe-48h-diagnostico
          path: diagnostico_visivel_48h/
          if-no-files-found: warn
          retention-days: 7
