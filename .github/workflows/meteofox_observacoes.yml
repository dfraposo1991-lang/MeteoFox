name: MeteoFox | Observações 20 min (METAR, SPECI, TAF AMD, SYNOP)

on:
  workflow_dispatch:
  schedule:
    - cron: '15,30,45 * * * *'

permissions:
  contents: write

concurrency:
  group: meteofox-observacoes
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar dados meteorológicos
        run: python recolher_observacoes.py
      - name: Publicar apenas as últimas mensagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aviation.json data/synop.json
          if git diff --cached --quiet; then
            echo "Não houve alterações."
            exit 0
          fi
          git commit -m "Atualizar observações MeteoFox [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
