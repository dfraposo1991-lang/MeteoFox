name: MeteoFox | Observações 20 min (METAR, SPECI, TAF AMD, SYNOP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'recolher_aviacao_mundial.py'
      - '.github/workflows/meteofox_observacoes.yml'
  schedule:
    - cron: '15,30,45 * * * *'

permissions:
  contents: write

concurrency:
  group: meteofox-observacoes
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar dados meteorológicos
        run: python recolher_observacoes.py
      - name: Atualizar boletins mundiais NOAA (sem descodificação)
        run: python recolher_aviacao_mundial.py
      - name: Publicar apenas as últimas mensagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aviation.json data/synop.json data/aviation_world.json.gz data/aviation_valencia.json
          if git diff --cached --quiet; then
            echo "Não houve alterações."
            exit 0
          fi
          git commit -m "Atualizar observações MeteoFox [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort
              echo "Conflito de observações: preservar dados publicados e repetir na próxima recolha."
              exit 1
            fi
            sleep 5
          done
          exit 1
