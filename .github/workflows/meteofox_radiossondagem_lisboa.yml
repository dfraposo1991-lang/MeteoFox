name: MeteoFox | Radiossondagem observada Lisboa 12Z
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'obter_radiossondagem_lisboa.py'
      - '.github/workflows/meteofox_radiossondagem_lisboa.yml'
  schedule:
    - cron: '30 15,19,23 * * *'
    - cron: '30 6 * * *'
permissions:
  contents: write
concurrency:
  group: meteofox-lisboa-sondagem-12z
  cancel-in-progress: false
jobs:
  observacao:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obter TEMP FM35 real da estação 08579
        run: python obter_radiossondagem_lisboa.py
      - name: Guardar observações validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos_experimentais/radiossondagem_lisboa.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar radiossondagem observada Lisboa 12Z"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
