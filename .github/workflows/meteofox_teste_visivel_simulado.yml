name: MeteoFox | Teste Visível Simulado ECMWF
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Obter ficheiros do repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar produto visível simulado
        run: python testar_visivel_simulado.py
      - name: Guardar relatório e possível PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-teste-visivel-simulado
          path: diagnostico_visivel_simulado/
          if-no-files-found: warn
