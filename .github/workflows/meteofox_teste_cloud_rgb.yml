name: "MeteoFox | Diagnóstico Cloud RGB ECMWF"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar catálogo e testar descarga PNG Cloud RGB
        run: python testar_cloud_rgb.py
      - name: Guardar relatório e eventual imagem de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-diagnostico-cloud-rgb
          path: diagnostico_cloud_rgb/
          if-no-files-found: warn
          retention-days: 7
