name: MeteoFox Labs | Gerar 90h e sondagens (isolado)

on:
  push:
    branches: [meteofox-meteograma-skewt-dev]
    paths:
      - '.github/workflows/meteofox_labs_generate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar_experimento:
    name: ECMWF 0p25 Lisboa +90h e sondagens
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar leitor ECMWF/GRIB
        run: python -m pip install 'ecmwf-opendata>=0.3,<1' 'eccodes>=2.38,<3'
      - name: Selecionar ciclo ECMWF 0p25 que tenha +90h e +54h
        shell: bash
        run: |
          python - <<'PY'
          from ecmwf.opendata import Client
          from datetime import timezone
          from pathlib import Path
          from gerar_produtos_experimentais import SURFACE_PARAMS,PRESSURE_PARAMS
          client=Client(source="ecmwf",model="ifs",resol="0p25")
          surface=client.latest(stream="oper",type="fc",levtype="sfc",step=90,param=list(SURFACE_PARAMS))
          pressure=client.latest(stream="oper",type="fc",levtype="pl",step=54,param=list(PRESSURE_PARAMS))
          for label,dt in [("90h superfície",surface),("54h pressão",pressure)]:
              print(label,dt,flush=True)
          if surface!=pressure:
              raise RuntimeError("Os produtos 90h superfície e 48h pressão ainda não são do mesmo ciclo")
          Path("selected_cycle.txt").write_text(surface.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
      - name: Gerar e validar todos os produtos
        shell: bash
        run: |
          python gerar_produtos_experimentais.py --cycle "$(cat selected_cycle.txt)"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("produtos_experimentais/previsao_ecmwf.json").read_text())
          assert len(data["meteogram_lisboa"])==30
          assert data["meteogram_lisboa"][-1]["step_h"]==90
          assert len(data["soundings"])==16
          assert set(data["soundings"][0]["cities"])=={"Porto","Lisboa","Beja"}
          print("Dados experimentais completos:",data["run_utc"])
          PY
      - name: Empacotar laboratório com gráficos interativos
        shell: bash
        run: |
          mkdir -p previa/produtos_experimentais
          cp laboratorio.html previa/index.html
          cp produtos_experimentais/previsao_ecmwf.json previa/produtos_experimentais/previsao_ecmwf.json
      - name: Disponibilizar apenas artifact de teste (NÃO PUBLICAR PAGES)
        uses: actions/upload-artifact@v4
        with:
          name: meteofx-laboratorio-previa
          path: previa
          retention-days: 3
