name: MeteoFox VIS | Testes de recuperação de rede
on:
  push:
    branches: [meteofox-vis-retry-recovery]
    paths:
      - 'gerar_visivel_swe_48h.py'
      - 'tests/test_vis_retry.py'
      - '.github/workflows/meteofox_vis_retry_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Testes de rede simulada sem contactar ECMWF
        run: python -m unittest discover -s tests -p 'test_vis_retry.py' -v
      - name: Compilar sintaxe do gerador
        run: python -m py_compile gerar_visivel_swe_48h.py
