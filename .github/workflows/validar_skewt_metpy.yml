name: MeteoFox | Auditoria termodinâmica MetPy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'laboratorio.html'
      - 'validar_skewt_metpy.py'
      - 'validar_conveccao_metpy.py'
      - 'meteofox_conveccao.js'
      - 'calcular_conveccao_metpy.py'
      - 'produtos_experimentais/previsao_ecmwf.json'
      - '.github/workflows/validar_skewt_metpy.yml'

permissions:
  contents: read

jobs:
  metpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar MetPy e NumPy
        run: python -m pip install 'metpy>=1.6,<2' 'numpy>=1.26,<3'
      - name: Comparar motor MeteoFox com MetPy
        run: python validar_skewt_metpy.py
      - name: Comparar shear, SRH e Bunkers com MetPy
        run: python validar_conveccao_metpy.py
      - name: Gerar diagnóstico termodinâmico MetPy de ensaio
        run: python calcular_conveccao_metpy.py
      - name: Guardar diagnóstico termodinâmico de ensaio
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-conveccao-termodinamica-ensaio
          path: produtos_experimentais/conveccao_termodinamica.json
          retention-days: 30
      - name: Guardar relatório de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-auditoria-metpy
          path: auditoria_skewt/
          if-no-files-found: warn
          retention-days: 30
