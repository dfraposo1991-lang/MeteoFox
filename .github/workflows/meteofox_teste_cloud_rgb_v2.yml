name: MeteoFox | Diagnóstico Cloud RGB v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Obter ficheiros do repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar endereços ECMWF
        run: python testar_cloud_rgb_v2.py
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteofox-diagnostico-cloud-rgb-v2
          path: diagnostico_cloud_rgb_v2.json
          if-no-files-found: warn
